# Authz applies its migrations on start (under a Postgres advisory lock, so replicas starting
# together are safe), seeds its own manifest, rebuilds the gateway view in Redis, then serves.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz
  labels: {{- include "authz.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "authz.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "authz.selector" . | nindent 8 }}
    spec:
      containers:
        - name: authz
          image: "{{ required "image.repository is required (see helmvars/)" .Values.image.repository }}:{{ required "image.tag is required (see helmvars/)" .Values.image.tag }}"
          ports:
            - { name: public, containerPort: 8080 }
            - { name: internal, containerPort: 8081 }
          env:
            - name: AUTHZ_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.postgres.name }}, key: url } }
            # Optional read replica; without the key, reads use the primary.
            - name: AUTHZ_DATABASE_READ_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.postgres.name }}, key: read_url, optional: true } }
            - name: AUTHZ_REDIS_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.redis.name }}, key: url } }
            - { name: AUTHZ_IDP_INTERNAL_URL, value: {{ .Values.idpInternalUrl | quote }} }
            - { name: AUTHZ_KAFKA_BROKERS, value: {{ .Values.kafka.brokers | quote }} }
            - { name: AUTHZ_KAFKA_TOPIC, value: {{ .Values.kafka.topic | quote }} }
            # Traces and app metrics (internal/telemetry); logs and infra metrics need nothing here.
            - { name: OTEL_TRACES_ENABLED, value: {{ .Values.otel.traces | quote }} }
            - { name: OTEL_METRICS_ENABLED, value: {{ .Values.otel.metrics | quote }} }
            {{- if or .Values.otel.traces .Values.otel.metrics }}
            - name: NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | default "http://$(NODE_IP):4317" | quote }} }
            - { name: OTEL_SERVICE_NAME, value: {{ .Values.otel.serviceName | quote }} }
            - { name: OTEL_TRACES_SAMPLER, value: {{ .Values.otel.sampler | quote }} }
            {{- with .Values.otel.samplerArg }}
            - { name: OTEL_TRACES_SAMPLER_ARG, value: {{ . | quote }} }
            {{- end }}
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),deployment.environment={{ .Values.domain }}" }
            {{- end }}
          # HealthService: liveness checks no dependency (a database outage never restarts pods),
          # readiness checks them all.
          readinessProbe: { httpGet: { path: /ready, port: internal } }
          livenessProbe: { httpGet: { path: /live, port: internal }, initialDelaySeconds: 10 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
# One Service, two ports, each serving Connect, gRPC, gRPC-Web and REST (HTTP/1.1 and h2c):
# public 8080 (gateway only), internal 8081 (the IdP, seed Jobs).
apiVersion: v1
kind: Service
metadata:
  name: authz
  labels: {{- include "authz.labels" . | nindent 4 }}
spec:
  selector: {{- include "authz.selector" . | nindent 4 }}
  ports:
    - { name: public, port: 8080, targetPort: public, appProtocol: kubernetes.io/h2c }
    - { name: internal, port: 8081, targetPort: internal, appProtocol: kubernetes.io/h2c }
