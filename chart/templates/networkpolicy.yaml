# Public port 8080: only the gateway (it sets the X-Bus-* headers the admin API trusts).
# Internal port 8081: in-cluster callers (IdP, seed Jobs). Each port serves every
# protocol (Connect, gRPC, gRPC-Web, REST). Egress is not restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authz
  labels: {{- include "authz.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "authz.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {{- toYaml .Values.networkPolicy.gateway.namespaceSelector | nindent 12 }}
          podSelector: {{- toYaml .Values.networkPolicy.gateway.podSelector | nindent 12 }}
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 8081 }
