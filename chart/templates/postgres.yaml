# Hand-written, like ../IdP's (Bitnami's Postgres chart went paid; an operator is a cluster-wide
# prerequisite). One StatefulSet, Authz's database only.
#
# CAUTION: postgres:16-alpine reads POSTGRES_PASSWORD only on first boot. Rotating the password
# later needs ALTER USER inside Postgres, or the url in the secret stops working.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "authz.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: authz, app.kubernetes.io/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: authz, app.kubernetes.io/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgres.username | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.postgres.name }}, key: password } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data, subPath: pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}] }
          livenessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}] }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.postgres.storageSize }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "authz.labels" . | nindent 4 }}
spec:
  clusterIP: None   # headless
  selector: { app.kubernetes.io/name: authz, app.kubernetes.io/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
