# Public base domain: the admin API is served through the gateway at api.<domain>/authz. Set it in helmvars/.
domain: ""

image: { repository: "", tag: "" }   # no default: set them in helmvars/
replicas: 2

# Names of pre-created Secrets. This chart never creates secrets.
secrets:
  # keys: password, url (postgres://authz:<password>@<release>-postgres:5432/authz?sslmode=disable),
  # read_url (optional: a read replica; without it, reads use url)
  postgres: { name: authz-postgres }
  # key: url (redis://[:<password>@]<host>:6379/0): the platform's Redis master (../Infra). Authz
  # writes the gateway view there; the gateway reads a replica.
  redis: { name: authz-redis }

# The IdP UI's cluster-internal Service (invitations). Never its public host: the IdP refuses it.
idpInternalUrl: http://idp-ui:3001

# Domain events go to this topic. Kafka is not part of this chart.
kafka:
  brokers: ""   # host:port[,host:port]; empty: events are only logged
  topic: authz.events

# Who may reach which port (needs a CNI that enforces NetworkPolicy):
#   public (8080, admin API, trusts X-Bus-* headers): only the APISIX gateway pods.
#   internal (8081, IdP / seed Jobs): any pod in the cluster; never the gateway's routes.
networkPolicy:
  gateway:
    namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: apisix } }
    podSelector: { matchLabels: { app.kubernetes.io/name: apisix } }

# The admin API's routes. Names must match manifest/authz.json (the catalogue Authz seeds itself).
apisixRoute:
  enabled: true
  ingressClassName: apisix

# Observability, like Datadog: the node's agent (an OpenTelemetry collector DaemonSet, ../Infra)
# collects this pod's logs (stdout) and its CPU and memory with nothing set here. The process adds
# what only it can see, when turned on: traces and app metrics, over OTLP to the agent on its own
# node (status.hostIP:4317, like DD_AGENT_HOST) unless endpoint says otherwise.
otel:
  traces: false
  metrics: false
  endpoint: ""        # empty: http://<node IP>:4317 (the agent's hostPort)
  serviceName: authz
  sampler: parentbased_always_on   # OTEL_TRACES_SAMPLER (e.g. parentbased_traceidratio with samplerArg)
  samplerArg: ""

resources: {}

postgres:
  image: postgres:16-alpine
  storageSize: 2Gi
  database: authz
  username: authz
  resources: {}
