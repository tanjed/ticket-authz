syntax = "proto3";

package bus.authz.v1;

import "bus/authz/v1/types.proto";
import "google/api/annotations.proto";

option go_package = "github.com/tanjed/bus2/authz/api/gen/bus/authz/v1;authzv1";

// InternalService is for callers inside the cluster: services' seed Jobs, the IdP, platform
// operations. Served on the internal listeners (REST :8081, gRPC :9091), which the gateway never
// routes. It has no authentication: the network is the boundary.
service InternalService {
  // Replaces a service's permissions and APISIX route map. Entries it no longer lists are
  // deprecated (denied by the gateway), never deleted; listing them again restores them.
  rpc ApplyManifest(ApplyManifestRequest) returns (ApplyManifestResponse) {
    option (google.api.http) = {
      put: "/internal/v1/manifests/{service}"
      body: "*"
    };
  }
  // A provider's company and roles, for the access token. The membership and company status come
  // from Company. NOT_FOUND: in no company. PERMISSION_DENIED: the company is not active
  // (suspended or pending_setup). UNAVAILABLE: Company cannot be reached.
  rpc GetClaims(GetClaimsRequest) returns (GetClaimsResponse) {
    option (google.api.http) = {get: "/internal/v1/subjects/{sub}/claims"};
  }
  // Publishes the company status (the status itself is Company's) to the gateway view (Redis).
  rpc SetCompanyStatus(SetCompanyStatusRequest) returns (SetCompanyStatusResponse) {
    option (google.api.http) = {
      put: "/internal/v1/companies/{company_id}/status"
      body: "*"
    };
  }
  // Creates the company's protected Admin role if it has none, makes user_id hold it, and
  // publishes company active, role `*` and the user's version. Idempotent: an existing protected
  // role is reused and the holding ensured. Called by Company on company creation.
  rpc CreateAdminRole(CreateAdminRoleRequest) returns (CreateAdminRoleResponse) {
    option (google.api.http) = {
      post: "/internal/v1/companies/{company_id}/admin"
      body: "*"
    };
  }
  // Adds these roles of the company to what the user holds (idempotent); role ids that no longer
  // exist are skipped. A new version is published. Called by Company on invitation accept.
  rpc AssignRoles(AssignRolesRequest) returns (AssignRolesResponse) {
    option (google.api.http) = {
      put: "/internal/v1/companies/{company_id}/users/{user_id}/roles"
      body: "*"
    };
  }
  // The escalation rule for an invitation: every role must belong to the company and the caller's
  // own permissions (read fresh) must cover them. PERMISSION_DENIED (escalation) or NOT_FOUND.
  rpc CheckAssignable(CheckAssignableRequest) returns (CheckAssignableResponse) {
    option (google.api.http) = {
      post: "/internal/v1/companies/{company_id}/assignable"
      body: "*"
    };
  }
  // removable = false with reason "last_admin" when the user is the only holder of the protected
  // Admin role.
  rpc CanRemoveUser(CanRemoveUserRequest) returns (CanRemoveUserResponse) {
    option (google.api.http) = {get: "/internal/v1/companies/{company_id}/users/{user_id}/removable"};
  }
  // Deletes the user's role assignments and bumps their version, so their token is stale at once.
  // Idempotent.
  rpc RevokeUser(RevokeUserRequest) returns (RevokeUserResponse) {
    option (google.api.http) = {delete: "/internal/v1/companies/{company_id}/users/{user_id}"};
  }
}

message ManifestPermission {
  // resource:action, lowercase, no API version.
  string key = 1;
  string description = 2;
  // In the consumer permission set.
  bool consumer = 3;
}

message ManifestRoute {
  // The APISIX route name (what the gateway looks up).
  string name = 1;
  // One of the manifest's permissions; empty when public or authenticated.
  string permission = 2;
  bool public = 3;
  // Any valid token (a provider's company active and token fresh, or a consumer) is enough; no
  // permission is checked. Exactly one of permission, public and authenticated is set.
  bool authenticated = 4;
}

message ApplyManifestRequest {
  string service = 1;
  repeated ManifestPermission permissions = 2;
  repeated ManifestRoute routes = 3;
}

message ApplyManifestResponse {
  string service = 1;
  int32 permissions = 2;
  int32 routes = 3;
  // False when the manifest matched what was stored (the gateway view did not change).
  bool changed = 4;
}

message GetClaimsRequest {
  string sub = 1;
}

message SetCompanyStatusRequest {
  string company_id = 1;
  CompanyStatus status = 2;
}

message GetClaimsResponse {
  string company_id = 1;
  repeated RoleRef roles = 2;
  // The member's authorization version: put it in the access token (claim authz_version). The
  // gateway refuses the token (401 token_stale) once the member's roles change.
  int64 authz_version = 3;
}

message SetCompanyStatusResponse {}

message CreateAdminRoleRequest {
  string company_id = 1;
  string user_id = 2;
}

message CreateAdminRoleResponse {
  string role_id = 1;
}

message AssignRolesRequest {
  string company_id = 1;
  string user_id = 2;
  repeated string role_ids = 3;
}

message AssignRolesResponse {}

message CheckAssignableRequest {
  string company_id = 1;
  string caller_user_id = 2;
  repeated string role_ids = 3;
}

message CheckAssignableResponse {}

message CanRemoveUserRequest {
  string company_id = 1;
  string user_id = 2;
}

message CanRemoveUserResponse {
  bool removable = 1;
  string reason = 2;
}

message RevokeUserRequest {
  string company_id = 1;
  string user_id = 2;
}

message RevokeUserResponse {}
