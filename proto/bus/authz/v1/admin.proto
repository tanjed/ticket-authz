syntax = "proto3";

package bus.authz.v1;

import "bus/authz/v1/types.proto";
import "google/api/annotations.proto";

option go_package = "github.com/tanjed/bus2/authz/api/gen/bus/authz/v1;authzv1";

// AdminService is the company admin API, served on the public listeners (REST :8080, gRPC :9090).
// Only the APISIX gateway can reach them: it has verified the caller's token and the route's
// permission, and passes the caller as x-bus-subject, x-bus-company-id and x-bus-user-type
// (HTTP headers, or gRPC metadata). Every call is scoped to the caller's company and checked
// against the escalation rule: nobody hands out permissions they do not hold.
service AdminService {
  // The live permission catalogue: what roles can be built from.
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = {get: "/v1/permissions"};
  }
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {get: "/v1/roles"};
  }
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {
    option (google.api.http) = {get: "/v1/roles/{id}"};
  }
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post: "/v1/roles"
      body: "*"
    };
  }
  // The caller's own access, read fresh from the database: for the provider UI's shell.
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {get: "/v1/me"};
  }
  // Replaces the name, permissions and landing path. The protected role can change its landing
  // path only.
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      put: "/v1/roles/{id}"
      body: "*"
    };
  }
  // Refused while the role is assigned, and for the protected role.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {delete: "/v1/roles/{id}"};
  }
  // Replaces the roles of a user of the caller's company (Company confirms the membership). The
  // company's last admin cannot lose the admin role.
  rpc SetMemberRoles(SetMemberRolesRequest) returns (SetMemberRolesResponse) {
    option (google.api.http) = {
      put: "/v1/members/{sub}/roles"
      body: "*"
    };
  }
  // Every user of the caller's company holding roles, with their role ids. The provider UI joins
  // it with Company's ListUsers.
  rpc ListUserRoles(ListUserRolesRequest) returns (ListUserRolesResponse) {
    option (google.api.http) = {get: "/v1/users/roles"};
  }
}

message ListPermissionsRequest {}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message GetRoleRequest {
  string id = 1;
}

message CreateRoleRequest {
  string name = 1;
  repeated string permissions = 2;
  string landing_path = 3;
}

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  repeated string permissions = 3;
  string landing_path = 4;
}

message GetMeRequest {}

message MeRole {
  string id = 1;
  string name = 2;
  string landing_path = 3;
}

message GetMeResponse {
  string user_id = 1;
  string company_id = 2;
  // Sorted union of the caller's roles' permissions, or ["*"] when a role grants all.
  repeated string permissions = 3;
  repeated MeRole roles = 4;
}

message DeleteRoleRequest {
  string id = 1;
}

message SetMemberRolesRequest {
  string sub = 1;
  repeated string role_ids = 2;
}

message GetRoleResponse {
  Role role = 1;
}

message CreateRoleResponse {
  Role role = 1;
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleResponse {}

message SetMemberRolesResponse {}

message ListUserRolesRequest {}

message ListUserRolesResponse {
  repeated UserRoles users = 1;
}
