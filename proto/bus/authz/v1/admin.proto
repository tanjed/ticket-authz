syntax = "proto3";

package bus.authz.v1;

import "bus/authz/v1/types.proto";
import "google/api/annotations.proto";

option go_package = "github.com/tanjed/bus2/authz/api/gen/bus/authz/v1;authzv1";

// AdminService is the company admin API, served on the public listeners (REST :8080, gRPC :9090).
// Only the APISIX gateway can reach them: it has verified the caller's token and the route's
// permission, and passes the caller as x-bus-subject, x-bus-company-id and x-bus-user-type
// (HTTP headers, or gRPC metadata). Every call is scoped to the caller's company and checked
// against the escalation rule: nobody hands out permissions they do not hold.
service AdminService {
  // The live permission catalogue: what roles can be built from.
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = {get: "/v1/permissions"};
  }
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {get: "/v1/roles"};
  }
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {
    option (google.api.http) = {get: "/v1/roles/{id}"};
  }
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post: "/v1/roles"
      body: "*"
    };
  }
  // Replaces the name and permissions. The protected role cannot be changed.
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      put: "/v1/roles/{id}"
      body: "*"
    };
  }
  // Refused while the role is assigned, and for the protected role.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {delete: "/v1/roles/{id}"};
  }
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = {get: "/v1/members"};
  }
  // Replaces the member's roles. The company's last admin cannot lose the admin role.
  rpc SetMemberRoles(SetMemberRolesRequest) returns (SetMemberRolesResponse) {
    option (google.api.http) = {
      put: "/v1/members/{sub}/roles"
      body: "*"
    };
  }
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (google.api.http) = {delete: "/v1/members/{sub}"};
  }
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (google.api.http) = {get: "/v1/invitations"};
  }
  // Invites a phone number with roles; the IdP sends the link. Replaces a pending invitation for
  // the same number. Someone who already belongs to a company cannot be invited.
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse) {
    option (google.api.http) = {
      post: "/v1/invitations"
      body: "*"
    };
  }
}

message ListPermissionsRequest {}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message GetRoleRequest {
  string id = 1;
}

message CreateRoleRequest {
  string name = 1;
  repeated string permissions = 2;
}

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  repeated string permissions = 3;
}

message DeleteRoleRequest {
  string id = 1;
}

message ListMembersRequest {}

message ListMembersResponse {
  repeated Member members = 1;
}

message SetMemberRolesRequest {
  string sub = 1;
  repeated string role_ids = 2;
}

message RemoveMemberRequest {
  string sub = 1;
}

message ListInvitationsRequest {}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
}

message CreateInvitationRequest {
  // E.164, e.g. +8801712345678.
  string phone = 1;
  repeated string role_ids = 2;
}

message GetRoleResponse {
  Role role = 1;
}

message CreateRoleResponse {
  Role role = 1;
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleResponse {}

message SetMemberRolesResponse {}

message RemoveMemberResponse {}

message CreateInvitationResponse {
  Invitation invitation = 1;
}
