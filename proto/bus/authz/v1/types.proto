syntax = "proto3";

package bus.authz.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/tanjed/bus2/authz/api/gen/bus/authz/v1;authzv1";

// A catalogue entry: resource:action, seeded by the service that owns it.
message Permission {
  string key = 1;
  string service = 2;
  string description = 3;
}

// A company-owned set of permissions. The protected role (grants_all) is created with the company.
message Role {
  string id = 1;
  string name = 2;
  bool protected = 3;
  // Every permission, including ones added to the catalogue later.
  bool grants_all = 4;
  // Bumped on every edit.
  int32 version = 5;
  repeated string permissions = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
  // Where the provider UI lands users holding this role; empty, or an absolute in-app path.
  string landing_path = 9;
}

// A role as it appears in a provider's access token.
message RoleRef {
  string id = 1;
  string name = 2;
  int32 version = 3;
}

message UserRoles {
  // The IdP identity id (the token's sub).
  string user_id = 1;
  repeated string role_ids = 2;
}

enum CompanyStatus {
  COMPANY_STATUS_UNSPECIFIED = 0;
  COMPANY_STATUS_ACTIVE = 1;
  // Every request of the company's users is denied, at once.
  COMPANY_STATUS_SUSPENDED = 2;
}
